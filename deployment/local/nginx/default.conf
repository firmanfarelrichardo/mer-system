# ===========================================
# MER System - Nginx Development Config
# ===========================================
# Server block untuk local development.
# Hanya berisi konfigurasi server block (bukan full nginx.conf)
# karena dimount sebagai conf.d/default.conf.
#
# PERBEDAAN DENGAN PRODUCTION:
#   - Tidak ada gzip (tidak perlu di lokal)
#   - Tidak ada static file caching (supaya perubahan langsung terlihat)
#   - Tidak ada security header tambahan
#   - fastcgi_pass mengarah ke service name 'app' (Docker DNS)
# ===========================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # -------------------------------------------
    # Laravel Front Controller Pattern
    # Semua request yang bukan file/folder statis
    # diarahkan ke index.php
    # -------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------
    # PHP-FPM Processing
    # fastcgi_pass menggunakan service name 'app'
    # Docker DNS otomatis resolve ke container app
    # -------------------------------------------
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # -------------------------------------------
    # Deny access to hidden & sensitive files
    # -------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|log|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
