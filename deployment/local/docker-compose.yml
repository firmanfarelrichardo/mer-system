services:
  # 1. Aplikasi (PHP-FPM)
  app:
    build:
      context: ../../              # MUNDUR ke Root Project
      dockerfile: deployment/local/Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../../:/var/www            # Mapping Root ke Container
    networks:
      - laravel-net
    depends_on:
      - db

  # 2. Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: laravel-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../:/var/www            # Nginx butuh akses ke file public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Config ada di sebelah file ini
    networks:
      - laravel-net
    depends_on:
      - app

  # 3. Database (Postgres)
  db:
    image: postgres:15-alpine
    container_name: laravel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - laravel-net

  # 4. Vite (Frontend)
  npm:
    image: node:20-alpine
    container_name: laravel-npm
    working_dir: /var/www
    volumes:
      - ../../:/var/www
    ports:
      - "5173:5173"
    command: npm run dev
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  dbdata: