user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Sembunyikan versi Nginx dari header Server response.
    # Mencegah attacker mengetahui versi untuk eksploit targeted.
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Limit ukuran request body untuk upload file & DOMPDF input.
    # 50M cukup untuk dokumen medis; lebih besar meningkatkan risiko DoS.
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # -----------------------------------------------
    # Security Headers
    # -----------------------------------------------
    # X-Frame-Options: mencegah clickjacking attack.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # X-Content-Type-Options: mencegah MIME-type sniffing attack.
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection: legacy header, tetap berguna untuk browser lama.
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS: memaksa browser selalu gunakan HTTPS selama 1 tahun.
    # Aktifkan hanya jika domain sudah full HTTPS; includeSubDomains mencakup subdomain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Main location
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # PHP-FPM
        # fastcgi_pass menggunakan Docker service name 'app'
        # karena nginx dan php-fpm berjalan di container terpisah
        # Docker DNS akan resolve 'app' ke IP container php-fpm
        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;

            # Timeouts — fastcgi_read_timeout dinaikkan ke 300s untuk mencegah
            # 504 Gateway Timeout saat DOMPDF merender dokumen PDF yang tebal/kompleks.
            # fastcgi_connect/send_timeout tetap 60s karena hanya untuk setup koneksi.
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 300s;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to sensitive files
        location ~* \.(env|log|sql)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
