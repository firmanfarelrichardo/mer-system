user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ═══════════════════════════════════════════════════════════════
    #  BASELINE
    # ═══════════════════════════════════════════════════════════════
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 50M: cukup untuk dokumen medis; lebih besar meningkatkan risiko DoS.
    client_max_body_size 50M;

    # ═══════════════════════════════════════════════════════════════
    #  GZIP
    # ═══════════════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # ═══════════════════════════════════════════════════════════════
    #  SECURITY HEADERS (berlaku global, semua location)
    # ═══════════════════════════════════════════════════════════════

    # HSTS — paksa HTTPS selama 1 tahun + preload list + subdomain.
    # WAJIB aktif setelah domain full HTTPS via Cloudflare.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP — HANYA izinkan resources dari domain sendiri.
    # 'self'         : hanya script/style/img/font dari origin yang sama.
    # 'unsafe-inline' : diperlukan untuk inline style Blade & Alpine.js x-bind.
    # data:           : untuk font inline dan small image base64 (DOMPDF output).
    # https://fonts.googleapis.com & gstatic: Google Fonts (jika dipakai).
    # Tidak ada wildcard (*), domain pihak ketiga lain, atau 'unsafe-eval'.
    # Efek: browser akan BLOKIR otomatis semua iklan pop-up, iframe asing,
    # dan external script injection yang menyebabkan flagging Google.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Anti-clickjacking — DENY karena MERS tidak perlu di-embed di iframe manapun.
    add_header X-Frame-Options "DENY" always;

    # Anti-MIME sniffing — mencegah browser menebak Content-Type.
    add_header X-Content-Type-Options "nosniff" always;

    # XSS filter legacy — masih berguna untuk IE/Edge lama.
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer — kirim origin saja saat cross-origin, full URL saat same-origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy — matikan semua API sensor yang tidak diperlukan.
    # Aplikasi MERS adalah web pelaporan insiden: tidak perlu kamera, mic, geolocation.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # ═══════════════════════════════════════════════════════════════
    #  REAL IP — Cloudflare Proxy Ranges
    #  Tanpa ini, $remote_addr akan menampilkan IP Cloudflare (CDN),
    #  bukan IP asli pengunjung. Modul real_ip mengganti $remote_addr
    #  dengan nilai dari header CF-Connecting-IP / X-Forwarded-For.
    #
    #  Daftar lengkap: https://www.cloudflare.com/ips/
    #  UPDATE berkala saat Cloudflare menambah range baru.
    # ═══════════════════════════════════════════════════════════════
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # ═══════════════════════════════════════════════════════════
        #  LEVEL 3 KILL SWITCH — Emergency Lockdown (Conditional Routing)
        #
        #  MEKANISME:
        #    Nginx memeriksa keberadaan file /etc/nginx/lockdown/.lockdown
        #    setiap kali ada request masuk. File ini BUKAN konfigurasi —
        #    ia hanya "sinyal" (trigger file) yang keberadaannya saja
        #    sudah cukup untuk mengaktifkan mode darurat.
        #
        #  JIKA FILE ADA (lockdown AKTIF):
        #    Variabel $lockdown_mode di-set ke "1".
        #    Seluruh traffic (kecuali /health) dialihkan ke halaman
        #    maintenance.html statis dengan HTTP 503 Service Unavailable.
        #    PHP-FPM TIDAK menerima request apapun — koneksi terputus total.
        #
        #  JIKA FILE TIDAK ADA (operasi NORMAL):
        #    Variabel $lockdown_mode tetap "0".
        #    Request mengalir normal: Nginx → PHP-FPM → Laravel.
        #
        #  KENAPA if -f (file existence check)?
        #    Nginx mendukung pengecekan file via `if (-f $path)` di
        #    server context. Ini aman dan ringan — hanya stat() syscall,
        #    tidak melibatkan I/O berat atau parsing konfigurasi ulang.
        #    TIDAK perlu nginx reload/restart untuk mengaktifkan lockdown.
        #
        #  KENAPA /etc/nginx/lockdown/ (BUKAN /tmp atau web root)?
        #    - /tmp: dapat diakses oleh proses lain di container, risiko
        #      race condition atau penghapusan tidak disengaja.
        #    - web root (/var/www/html/public): accessible dari internet
        #      jika ada misconfiguration, membocorkan status lockdown.
        #    - /etc/nginx/lockdown/: hanya Nginx yang membaca, di-mount
        #      sebagai volume terpisah, dikendalikan HANYA dari host.
        #
        #  URUTAN EKSEKUSI LOCKDOWN:
        #    1. Operator menjalankan lockdown.sh di host VPS.
        #    2. Script membuat file .lockdown di host volume.
        #    3. Nginx langsung membaca file (bind mount = real-time).
        #    4. Script mem-pause container app, db, redis via Docker.
        #    5. Sistem terisolasi: Nginx melayani 503, backend beku.
        # ═══════════════════════════════════════════════════════════
        set $lockdown_mode "0";
        if (-f /etc/nginx/lockdown/.lockdown) {
            set $lockdown_mode "1";
        }

        # ───────────────────────────────────────────────────────────
        #  FORCE HTTPS — Redirect semua request non-HTTPS
        #
        #  ARSITEKTUR (Cloudflare Full Strict):
        #    Browser ──HTTPS──> Cloudflare ──HTTP:80──> Nginx ──> PHP-FPM
        #
        #  Cloudflare mengirim header X-Forwarded-Proto: https/http.
        #  Jika header ini bukan "https", artinya request datang
        #  TANPA melalui Cloudflare (direct IP access / bypass).
        #  -> Nginx me-redirect paksa ke HTTPS via domain.
        #
        #  KENAPA BUKAN return 301?
        #  Menggunakan `if` di level server block (bukan location)
        #  aman sesuai Nginx docs: "the only 100% safe things
        #  inside if in server context are: return, rewrite."
        #
        #  Health check endpoint dikecualikan karena dipanggil
        #  secara internal oleh Docker tanpa melalui Cloudflare.
        # ───────────────────────────────────────────────────────────
        set $redirect_to_https 0;
        if ($http_x_forwarded_proto != "https") {
            set $redirect_to_https 1;
        }
        if ($request_uri = /health) {
            set $redirect_to_https 0;
        }
        if ($redirect_to_https = 1) {
            return 301 https://$host$request_uri;
        }

        # ───────────────────────────────────────────────────────────
        #  Health check (internal — tidak perlu security headers)
        #  PENTING: Health check HARUS tetap aktif bahkan saat lockdown.
        #  Docker healthcheck memantau Nginx — jika endpoint ini mati,
        #  Docker akan restart container web dan mengganggu lockdown.
        # ───────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ───────────────────────────────────────────────────────────
        #  LOCKDOWN INTERCEPT — Serve maintenance page saat darurat
        #
        #  error_page 503 mengarahkan ke named location @maintenance.
        #  Named location (@) tidak bisa diakses langsung oleh client —
        #  hanya bisa dipicu secara internal oleh Nginx (via error_page).
        #  Ini mencegah siapapun mengakses /maintenance.html secara langsung
        #  untuk mengecek apakah file tersebut ada.
        #
        #  Header Retry-After: 3600 memberitahu browser dan search engine
        #  bahwa downtime bersifat sementara (~1 jam). Ini mencegah
        #  Google menghapus halaman dari index karena menganggap situs mati.
        #
        #  Cache-Control: no-store memastikan browser TIDAK meng-cache
        #  halaman maintenance. Saat lockdown dicabut, pengguna langsung
        #  mendapatkan halaman normal tanpa harus clear cache.
        # ───────────────────────────────────────────────────────────
        error_page 503 @maintenance;
        location @maintenance {
            root /etc/nginx/lockdown;
            rewrite ^(.*)$ /maintenance.html break;
            add_header Content-Type "text/html; charset=utf-8" always;
            add_header Retry-After 3600 always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            internal;
        }

        # ───────────────────────────────────────────────────────────
        #  BLOKIR EKSEKUSI PHP DI FOLDER UPLOAD/STORAGE
        #  Jika hacker berhasil upload file .php ke storage,
        #  Nginx akan mengembalikan 403 — file TIDAK dieksekusi.
        # ───────────────────────────────────────────────────────────
        location ~* ^/storage/.*\.php$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ───────────────────────────────────────────────────────────
        #  Main location — Laravel front controller
        #
        #  LOCKDOWN GUARD: Jika $lockdown_mode = "1", Nginx langsung
        #  mengembalikan 503 sebelum request mencapai try_files.
        #  PHP-FPM tidak menerima koneksi apapun — isolasi total.
        # ───────────────────────────────────────────────────────────
        location / {
            if ($lockdown_mode = "1") {
                return 503;
            }
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ───────────────────────────────────────────────────────────
        #  Static files — cache panjang, tanpa PHP processing
        #
        #  Saat lockdown, static files juga diblokir karena:
        #  1. Menyajikan CSS/JS/gambar saat 503 membingungkan pengguna.
        #  2. Jika attacker menaruh file berbahaya di public/, file
        #     tersebut tetap bisa diakses tanpa guard ini.
        #  3. Konsistensi: saat lockdown, SEMUA endpoint mati kecuali
        #     /health dan halaman maintenance.
        # ───────────────────────────────────────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
            if ($lockdown_mode = "1") {
                return 503;
            }
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ───────────────────────────────────────────────────────────
        #  PHP-FPM — HANYA index.php yang boleh dieksekusi
        #  Ini adalah pertahanan utama: Nginx tidak akan mengirim
        #  file .php sembarang ke PHP-FPM. Hanya /index.php.
        #
        #  Saat lockdown, blok ini tidak akan tercapai karena
        #  location / sudah me-return 503 lebih dahulu (try_files
        #  tidak pernah sampai ke /index.php). Guard tambahan
        #  tetap dipasang sebagai defense-in-depth.
        # ───────────────────────────────────────────────────────────
        location ~ \.php$ {
            if ($lockdown_mode = "1") {
                return 503;
            }

            # KRITIS: tolak semua PHP kecuali index.php
            # Mencegah direct access ke file PHP lain yang mungkin
            # di-upload attacker atau ada di vendor/.
            location ~ ^/index\.php$ {
                if ($lockdown_mode = "1") {
                    return 503;
                }
                fastcgi_pass app:9000;
                fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                include fastcgi_params;
                fastcgi_hide_header X-Powered-By;

                fastcgi_connect_timeout 60s;
                fastcgi_send_timeout 60s;
                fastcgi_read_timeout 300s;
            }

            # Semua .php lain -> 404 (BUKAN 403, agar tidak bocorkan info)
            return 404;
        }

        # ───────────────────────────────────────────────────────────
        #  Deny hidden files (.env, .git, .htaccess, dll)
        # ───────────────────────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ───────────────────────────────────────────────────────────
        #  Deny sensitive files (.env, .log, .sql, .bak, .sh)
        # ───────────────────────────────────────────────────────────
        location ~* \.(env|log|sql|bak|sh|yml|yaml|toml|lock|md)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
