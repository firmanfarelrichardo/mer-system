; ===========================================
; MER System - Production PHP Configuration
; VPS: RAM 8GB, CPU 2 Core
; Dioptimalkan untuk DOMPDF (PDF generation intensif)
; ===========================================

; Performance — OPcache
; opcache.validate_timestamps=0 paling krusial: PHP tidak perlu stat() file
; di setiap request untuk cek perubahan. Meningkatkan throughput ~40%.
; Di production kode tidak berubah tanpa deploy, jadi aman dimatikan.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; Memory & Execution
; memory_limit=512M: VPS 8GB memungkinkan alokasi besar.
; DOMPDF membutuhkan memori besar saat render PDF dengan banyak tabel/gambar.
; max_execution_time=300: PDF generation kompleks bisa memakan waktu >60 detik.
memory_limit=512M
max_execution_time=300
max_input_time=300
post_max_size=50M
upload_max_filesize=50M
max_file_uploads=20

; Error handling (production - no display)
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/var/www/html/storage/logs/php-error.log
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Session
session.save_handler=files
session.save_path=/tmp
session.gc_maxlifetime=7200
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax

; Security
expose_php=Off
allow_url_fopen=Off
allow_url_include=Off

; Timezone
date.timezone=Asia/Jakarta

; Realpath cache (for better performance)
realpath_cache_size=4096K
realpath_cache_ttl=600
