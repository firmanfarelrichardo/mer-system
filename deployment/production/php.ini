; ===========================================
; MER System — Production PHP Configuration
; VPS: Ubuntu 24.04 LTS | RAM 8GB | CPU 2 Core
; Dioptimalkan untuk DOMPDF (PDF generation intensif)
; ===========================================

; -----------------------------------------------
; OPcache — Performance Production
; -----------------------------------------------
; opcache.validate_timestamps=0: PHP TIDAK stat() file setiap request.
; Speed boost ~40%. Aman karena kode hanya berubah saat deploy
; (deploy.sh menjalankan optimize:clear untuk flush cache).
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.fast_shutdown=1

; -----------------------------------------------
; Memory & Execution — DOMPDF Tuning
; -----------------------------------------------
; memory_limit=512M: DOMPDF membutuhkan banyak memori saat render
; PDF dengan tabel kompleks dan gambar embedded (base64).
; max_execution_time=300: PDF generation bisa >60 detik untuk dokumen tebal.
memory_limit=512M
max_execution_time=300
max_input_time=300
post_max_size=50M
upload_max_filesize=50M
max_file_uploads=20

; -----------------------------------------------
; Error Handling (production — no display)
; -----------------------------------------------
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/var/www/html/storage/logs/php-error.log
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------
; Session
; -----------------------------------------------
session.save_handler=files
session.save_path=/tmp
session.gc_maxlifetime=7200
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax

; -----------------------------------------------
; Security
; -----------------------------------------------
; expose_php=Off: menyembunyikan X-Powered-By header (PHP version).
expose_php=Off
allow_url_fopen=Off
allow_url_include=Off

; -----------------------------------------------
; Timezone & Realpath Cache
; -----------------------------------------------
date.timezone=Asia/Jakarta
realpath_cache_size=4096K
realpath_cache_ttl=600
