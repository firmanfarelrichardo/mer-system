[supervisord]
nodaemon=true
; Redirect supervisord log ke /dev/null karena dalam Docker, stdout/stderr
; container sudah di-capture oleh docker logging driver.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
; Supervisord sendiri harus root agar bisa fork processes sebagai user lain.
user=root

; -----------------------------------------------
; PHP-FPM
; Proses utama yang melayani request dari Nginx.
; autostart + autorestart memastikan FPM selalu berjalan.
; priority=1 memastikan FPM naik sebelum queue worker.
; -----------------------------------------------
[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=1

; -----------------------------------------------
; Laravel Queue Worker
; Menjalankan 2 worker process untuk concurrency.
; --max-time=3600: worker restart setiap 1 jam untuk mencegah memory leak.
; --tries=3: job gagal di-retry 3 kali sebelum masuk failed_jobs table.
; stopwaitsecs=3600: supervisord menunggu worker selesai job aktif saat shutdown
;   (SIGTERM graceful stop), mencegah job terpotong di tengah eksekusi.
; user=www-data: worker berjalan sebagai non-root sesuai prinsip least privilege.
; -----------------------------------------------
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
priority=5

; -----------------------------------------------
; Laravel Scheduler
; Infinite loop 60 detik menggantikan cron karena container tidak memiliki cron daemon.
; Pendekatan ini ringan dan cukup untuk production di VPS tunggal.
; -----------------------------------------------
[program:scheduler]
command=sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
priority=10
