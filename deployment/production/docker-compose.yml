# ===========================================
# MER System — Production Docker Compose
# VPS: Ubuntu 24.04 LTS | RAM 8GB | CPU 2 Core
# ===========================================
#
# ARSITEKTUR (4 services):
#   app  → PHP-FPM + Queue Worker + Scheduler (via Supervisord)
#   web  → Nginx reverse proxy (SATU-SATUNYA yang expose port ke host)
#   db   → PostgreSQL 16 (TIDAK expose port — internal only)
#   redis→ Redis 7 (TIDAK expose port — internal only)
#
# SECURITY ISOLATION:
#   DILARANG mengekspos port db (5432) dan redis (6379) ke host.
#   Akses DB remote: gunakan SSH Tunnel → ssh -L 5432:db:5432 user@vps
#
# RESTART POLICY:
#   'unless-stopped' → container restart otomatis kecuali di-stop manual
#   oleh operator (misal: maintenance window).
# ===========================================

services:
  # -------------------------------------------
  # PHP-FPM Application + Queue Worker + Scheduler
  # -------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MER System}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    volumes:
      # Public assets shared dengan Nginx via named volume.
      # Entrypoint sync /var/www/html/public → /public-shared.
      - shared-public:/public-shared
      # Storage & logs di-mount agar data file upload dan log
      # TIDAK hilang saat container di-rebuild.
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    networks:
      - mer-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------
  # Nginx Web Server — SATU-SATUNYA port yang terbuka ke host
  # -------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: mer-web-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - shared-public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mer-prod-network

  # -------------------------------------------
  # PostgreSQL 16 — TIDAK expose port ke host (internal only)
  # Akses remote: SSH Tunnel → ssh -L 5432:localhost:5432 user@vps
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mer-db-prod
    restart: unless-stopped
    # SECURITY: Tidak ada 'ports:' — DB hanya bisa diakses dari internal network.
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mer-db-data:/var/lib/postgresql/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------
  # Redis 7 — TIDAK expose port ke host (internal only)
  # --requirepass: defense-in-depth (autentikasi meski internal).
  # --appendonly yes: persistence agar session/cache tidak hilang saat restart.
  # --maxmemory 512mb: headroom cukup untuk VPS 8GB.
  # --maxmemory-policy allkeys-lru: evict key terlama saat penuh.
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mer-redis-prod
    restart: unless-stopped
    # SECURITY: Tidak ada 'ports:' — Redis hanya bisa diakses dari internal network.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - mer-redis-data:/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ===========================================
# Networks — isolasi internal via bridge
# ===========================================
networks:
  mer-prod-network:
    driver: bridge

# ===========================================
# Volumes — persistent data
# ===========================================
volumes:
  shared-public:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local
  mer-db-data:
    driver: local
  mer-redis-data:
    driver: local
