# ===========================================
# MER System — Production Docker Compose
# VPS: Ubuntu 24.04 LTS | RAM 8GB | CPU 2 Core
# ===========================================
# PRINSIP KEAMANAN:
# - Hanya port 80 Nginx yang terexpose ke host (melalui Cloudflare)
# - PostgreSQL di-bind ke 127.0.0.1 (loopback only)
# - Redis tidak expose port sama sekali (internal only)
# - Setiap container memiliki memory limit untuk mencegah OOM
# ===========================================

services:
  # -------------------------------------------
  # PHP-FPM Application Server
  # -------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MER System}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
    volumes:
      # Public assets shared dengan Nginx via named volume.
      # Entrypoint sync /var/www/html/public → /public-shared.
      - shared-public:/public-shared
      # Storage & logs di-mount agar data file upload dan log
      # TIDAK hilang saat container di-rebuild.
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    networks:
      - mer-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # -------------------------------------------
  # Nginx Reverse Proxy
  # Satu-satunya container yang expose port ke host.
  # -------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: mer-web-prod
    restart: unless-stopped
    # LOG ROTATION: sama dengan service app di atas.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - shared-public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - app
    networks:
      - mer-prod-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # -------------------------------------------
  # PostgreSQL 16 Database
  # Port di-bind ke 127.0.0.1 (loopback) — BUKAN 0.0.0.0.
  # Akses remote via SSH Tunnel saja.
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mer-db-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # SECURITY: Tidak ada 'ports:' — DB hanya bisa diakses dari internal network.
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mer-db-data:/var/lib/postgresql/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c log_min_duration_statement=1000
      -c log_statement=ddl

  # -------------------------------------------
  # Redis 7 (Cache, Session, Queue)
  # Tidak expose port - hanya akses internal docker network.
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mer-redis-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    # Penjelasan flag:
    #   --requirepass     : Wajibkan autentikasi. Semua klien (Laravel app, worker,
    #                       scheduler) harus menyertakan password ini. Tanpa flag ini,
    #                       siapapun di network yang sama bisa akses Redis tanpa password.
    #   --appendonly yes  : Mode AOF (Append-Only File). Setiap perintah write dicatat
    #                       ke disk. Data sesi & antrean job TIDAK hilang saat container
    #                       restart atau VPS reboot. Trade-off: sedikit I/O lebih tinggi.
    #   --maxmemory 512mb : Batasi RAM Redis ke 512MB. Mencegah OOM (Out of Memory)
    #                       yang akan crash seluruh VPS. Menyisakan ~7.5GB untuk OS,
    #                       PostgreSQL, dan PHP-FPM.
    #   --maxmemory-policy: Saat 512MB penuh, hapus key yang paling lama tidak diakses
    #     allkeys-lru       (Least Recently Used). Aplikasi tetap responsif; Redis tidak
    #                       mengembalikan error OOM ke Laravel.
    volumes:
      - mer-redis-data:/data  # Named volume untuk persistensi data AOF di host
    networks:
      - mer-prod-network
    healthcheck:
      # CMD-SHELL digunakan agar bisa memakai pipe (|) untuk validasi response.
      # --no-auth-warning: supres peringatan "Warning: Using a password..." dari redis-cli
      # agar log container tidak dipenuhi warning setiap 10 detik.
      # grep PONG: healthcheck hanya PASS jika response benar-benar "PONG",
      # bukan sekedar exit code 0 dari redis-cli.
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 128M

networks:
  mer-prod-network:
    driver: bridge

volumes:
  shared-public:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local
  mer-db-data:
    driver: local
  mer-redis-data:
    driver: local