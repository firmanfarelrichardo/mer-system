# ===========================================
# MER System - Production Docker Compose
# ===========================================

services:
  # -------------------------------------------
  # PHP-FPM Application (Production)
  # -------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile
    container_name: mer-app-prod
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-MER System}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    volumes:
      - shared-public:/var/www/html/public
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    networks:
      - mer-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------
  # Nginx Web Server (Production)
  # -------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: mer-web-prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - shared-public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mer-prod-network

  # -------------------------------------------
  # PostgreSQL 16 (Production)
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mer-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mer-db-data:/var/lib/postgresql/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------
  # Redis 7 (Production)
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mer-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - mer-redis-data:/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ===========================================
# Networks
# ===========================================
networks:
  mer-prod-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  shared-public:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local
  mer-db-data:
    driver: local
  mer-redis-data:
    driver: local
