# ===========================================
# MER System - Production Docker Compose
# VPS: Ubuntu 24.04 LTS | RAM 8GB | CPU 2 Core
# ===========================================
#
# ARSITEKTUR:
# - 4 services: app (PHP-FPM + Worker + Scheduler),
#               web (Nginx), db (PostgreSQL 16), redis (Redis 7)
# - Network isolation: hanya port 80 milik 'web' yang terbuka ke host.
#   db hanya bisa diakses via loopback (SSH Tunnel untuk pgAdmin).
#   redis tidak expose port sama sekali (internal network only).
# - 'unless-stopped' dipilih vs 'always' agar container tidak auto-start
#   kembali jika di-stop manual oleh operator (misal: maintenance window).
# ===========================================

services:
  # -------------------------------------------
  # PHP-FPM Application (Production)
  #
  # VOLUME STRATEGY:
  #   shared-public di-mount ke /public-shared (bukan /var/www/html/public)
  #   agar file public bawaan image tetap utuh.
  #   Entrypoint akan meng-copy /var/www/html/public → /public-shared
  #   menggunakan mekanisme lock untuk keamanan multi-replica.
  # -------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile
    restart: unless-stopped   # Restart otomatis kecuali di-stop manual oleh operator
    environment:
      APP_NAME: ${APP_NAME:-MER System}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # REDIS_PASSWORD WAJIB diisi di .env jika Redis dikonfigurasi --requirepass.
      # Nilai ini dikirim ke aplikasi Laravel & digunakan supervisord untuk restart worker.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    volumes:
      - shared-public:/public-shared
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    networks:
      - mer-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------
  # Nginx Web Server (Production)
  #
  # Satu-satunya service yang expose port ke host (port 80).
  # nginx.conf di-mount read-only untuk keamanan.
  # Static files dibaca dari shared-public volume yang di-sync
  # oleh app container saat startup (via docker-entrypoint.sh).
  # -------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: mer-web-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - shared-public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mer-prod-network

  # -------------------------------------------
  # PostgreSQL 16 (Production)
  #
  # Port 5432 di-bind ke 127.0.0.1 (loopback host) BUKAN 0.0.0.0.
  # Artinya port tidak bisa diakses dari internet, hanya dari server itu sendiri.
  # Akses remote via SSH Tunnel: ssh -L 5432:127.0.0.1:5432 user@vps-ip
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mer-db-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mer-db-data:/var/lib/postgresql/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------
  # Redis 7 (Production)
  #
  # Tidak expose port ke host sama sekali — akses hanya dari internal docker network.
  # --requirepass: mewajibkan autentikasi meski Redis hanya internal,
  #   sesuai defense-in-depth principle (jika network container bocor).
  # --appendonly yes: persistence mode agar session/cache tidak hilang saat restart.
  # --maxmemory 512mb: memberi headroom lebih besar mengingat VPS 8GB.
  # --maxmemory-policy allkeys-lru: evict key terlama saat penuh (optimal untuk cache).
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mer-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - mer-redis-data:/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ===========================================
# Networks
# ===========================================
networks:
  mer-prod-network:
    # bridge driver default dengan isolasi internal.
    # Hanya service dalam network ini yang bisa saling berkomunikasi.
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  shared-public:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local
  mer-db-data:
    driver: local
  mer-redis-data:
    driver: local
