# ===========================================
# MER System - Production Docker Compose
# ===========================================
# Arsitektur: 4 services (app, web, db, redis)
#
# Prinsip Keamanan & Skalabilitas:
# - Database hanya bisa diakses via loopback (127.0.0.1)
#   → aman dari akses internet, bisa SSH Tunnel via pgAdmin
# - Redis tidak expose port ke host (internal network only)
# - Shared volume menggunakan staging path (/public-shared)
#   agar public assets di image tidak ter-shadow oleh volume mount
# - container_name TIDAK diset untuk app service
#   agar mendukung horizontal scaling (replicas > 1)
# ===========================================

services:
  # -------------------------------------------
  # PHP-FPM Application (Production)
  #
  # VOLUME STRATEGY:
  #   shared-public di-mount ke /public-shared (bukan /var/www/html/public)
  #   agar file public bawaan image tetap utuh.
  #   Entrypoint akan meng-copy /var/www/html/public → /public-shared
  #   menggunakan mekanisme lock untuk keamanan multi-replica.
  # -------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-MER System}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
    volumes:
      - shared-public:/public-shared
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    networks:
      - mer-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------
  # Nginx Web Server (Production)
  #
  # Membaca static files dari shared-public volume
  # yang sudah di-sync oleh app container entrypoint.
  #
  # CATATAN: nginx.conf di-mount sebagai /etc/nginx/nginx.conf
  # (bukan conf.d/) karena berisi full config block
  # termasuk events{}, http{}, dan server{}.
  # -------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: mer-web-prod
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - shared-public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - mer-prod-network

  # -------------------------------------------
  # PostgreSQL 16 (Production)
  #
  # KEAMANAN - Loopback Binding:
  #   Port 5432 hanya di-bind ke 127.0.0.1 (loopback).
  #   Ini berarti port TIDAK bisa diakses dari internet luar,
  #   hanya dari host server itu sendiri.
  #
  #   Untuk mengakses database dari workstation lokal:
  #   1. SSH Tunnel ke VPS: ssh -L 5432:127.0.0.1:5432 user@vps-ip
  #   2. Buka pgAdmin, koneksi ke localhost:5432
  #   3. Traffic di-encrypt oleh SSH, tidak ada port terbuka
  #
  #   Ini adalah best practice untuk database di production
  #   yang tidak menggunakan managed database service.
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mer-db-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mer-db-data:/var/lib/postgresql/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------
  # Redis 7 (Production)
  #
  # TIDAK expose port ke host (internal only).
  # Hanya bisa diakses oleh service dalam network yang sama.
  # --appendonly yes: persistence mode untuk data safety
  # --maxmemory: limit memory usage
  # --maxmemory-policy: evict least recently used keys saat penuh
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mer-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - mer-redis-data:/data
    networks:
      - mer-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ===========================================
# Networks
# ===========================================
networks:
  mer-prod-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  shared-public:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local
  mer-db-data:
    driver: local
  mer-redis-data:
    driver: local
