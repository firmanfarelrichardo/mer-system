# ===========================================
# MER System - Staging Docker Compose
# ===========================================
# ISOLASI: Network, port, database, dan volume semuanya
# terpisah dari production. Container staging berjalan
# di mer-staging-network yang tidak bisa berkomunikasi
# dengan mer-prod-network.
#
# AKSES: Nginx staging di-bind ke 127.0.0.1:8080.
# Untuk mengakses staging dari browser lokal, gunakan SSH Tunnel:
#   ssh -L 8080:127.0.0.1:8080 mer-vps
#   Lalu buka: http://localhost:8080
# ===========================================

services:
  app:
    build:
      context: ../..
      dockerfile: deployment/staging/Dockerfile
    container_name: mer-app-staging
    restart: unless-stopped
    environment:
      APP_NAME: "MER System (Staging)"
      APP_ENV: staging
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-mer_staging}
      DB_USERNAME: ${DB_USERNAME:-mer_staging_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ../../:/var/www/html
      - staging-shared-public:/public-shared
      - staging-app-storage:/var/www/html/storage/app
      - staging-app-logs:/var/www/html/storage/logs
    networks:
      - mer-staging-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  web:
    image: nginx:1.27-alpine
    container_name: mer-web-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ../../public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mer-staging-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  db:
    image: postgres:16-alpine
    container_name: mer-db-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mer_staging}
      POSTGRES_USER: ${DB_USERNAME:-mer_staging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - staging-db-data:/var/lib/postgresql/data
    networks:
      - mer-staging-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-mer_staging}", "-U", "${DB_USERNAME:-mer_staging_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=30

  redis:
    image: redis:7-alpine
    container_name: mer-redis-staging
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - staging-redis-data:/data
    networks:
      - mer-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

networks:
  mer-staging-network:
    driver: bridge

volumes:
  staging-shared-public:
    driver: local
  staging-app-storage:
    driver: local
  staging-app-logs:
    driver: local
  staging-db-data:
    driver: local
  staging-redis-data:
    driver: local
