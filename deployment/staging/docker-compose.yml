# ===========================================
# MER System - Development Docker Compose
# ===========================================
# Arsitektur: 5 services terpisah (app, web, vite, db, redis)
#
# Prinsip Desain:
# - Setiap concern dipisah ke container masing-masing
# - PHP-FPM hanya menangani PHP processing
# - Node.js/Vite dipisah untuk HMR (Hot Module Replacement)
# - Nginx sebagai reverse proxy ke PHP-FPM
# - depends_on + healthcheck menjamin urutan startup
# ===========================================

services:
  # -------------------------------------------
  # PHP-FPM Application (Development)
  # -------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deployment/staging/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: mer-app-dev
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MER System}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      APP_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/var/www/html
    networks:
      - mer-dev-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------
  # Nginx Web Server (Development)
  # -------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: mer-web-dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ../..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mer-dev-network

  # -------------------------------------------
  # Vite Dev Server - Hot Module Replacement (HMR)
  #
  # MENGAPA DIPISAH:
  #   PHP-FPM container tidak memiliki Node.js.
  #   Menggabungkan Node.js ke image PHP menambah
  #   ~300MB ukuran image dan melanggar prinsip
  #   Single Responsibility (satu container, satu proses).
  #
  #   Container ini menjalankan Vite dev server yang
  #   meng-compile CSS/JS secara real-time dan menyediakan
  #   HMR via WebSocket agar browser auto-refresh
  #   saat file resources/ berubah.
  #
  # ALUR KERJA:
  #   1. Vite container mount source code yang sama
  #   2. Menjalankan npm install + npm run dev
  #   3. File public/hot dibuat oleh Vite plugin Laravel
  #   4. PHP membaca public/hot → tahu Vite dev server aktif
  #   5. Blade @vite() directive mengarahkan browser ke
  #      localhost:${VITE_PORT} untuk mengambil assets
  # -------------------------------------------
  vite:
    image: node:22-alpine
    container_name: mer-vite-dev
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ../..:/var/www/html
      - vite-node-modules:/var/www/html/node_modules
    command: sh -c "rm -rf node_modules/.package-lock.json && npm install --prefer-offline && npm run dev"
    networks:
      - mer-dev-network

  # -------------------------------------------
  # PostgreSQL 16 (Development)
  # -------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mer-db-dev
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - mer-db-data:/var/lib/postgresql/data
    networks:
      - mer-dev-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------
  # Redis 7 (Development)
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mer-redis-dev
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - mer-redis-data:/data
    networks:
      - mer-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ===========================================
# Networks
# ===========================================
networks:
  mer-dev-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  mer-db-data:
    driver: local
  mer-redis-data:
    driver: local
  vite-node-modules:
    driver: local
