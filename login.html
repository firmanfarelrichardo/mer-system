<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Sistem Pelaporan Insiden Obat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{cream:'#FEFFD3',primary:'#2E7D32','primary-dark':'#1B5E20','primary-light':'#4CAF50',sage:'#A5D6A7','sage-light':'#C8E6C9'}}}}</script>
    <style>body{background:#FEFFD3}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.float-anim{animation:float 6s ease-in-out infinite}.float-anim-delay{animation:float 6s ease-in-out 2s infinite}</style>
</head>
<body class="min-h-screen font-sans antialiased flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Background decorations -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-sage/20 rounded-full blur-3xl float-anim"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-primary/10 rounded-full blur-3xl float-anim-delay"></div>

    <!-- Login Card -->
    <div class="w-full max-w-md relative z-10">
        <div class="bg-white rounded-3xl shadow-2xl p-8 sm:p-10">
            <!-- Logo & Title -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-primary/25">
                    <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-gray-800 mb-1">Sistem MER</h1>
                <p class="text-sm text-gray-500">Masuk ke akun Anda untuk melanjutkan</p>
            </div>

            <!-- Login Form -->
            <form onsubmit="return handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Nama Pengguna / NIP</label>
                    <div class="relative">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input type="text" id="usernameInput" placeholder="Masukkan nama pengguna" class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition placeholder:text-gray-400" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" id="passwordInput" placeholder="Masukkan kata sandi" class="w-full pl-11 pr-12 py-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition placeholder:text-gray-400" required>
                        <button type="button" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="errorMsg" class="hidden bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-600 font-medium"></div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 text-primary rounded focus:ring-primary border-gray-300">
                        <span class="text-sm text-gray-600">Ingat saya</span>
                    </label>
                    <a href="#" class="text-sm text-primary font-semibold hover:text-primary-dark transition">Lupa Kata Sandi?</a>
                </div>

                <button type="submit" class="w-full py-3 text-sm font-bold text-white bg-primary rounded-xl hover:bg-primary-dark transition shadow-lg shadow-primary/25 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Masuk
                </button>
            </form>

            <p class="mt-6 text-center text-xs text-gray-400">Belum punya akun? Hubungi <a href="#" class="text-primary font-semibold hover:underline">Administrator</a></p>
        </div>

        <p class="text-center text-xs text-gray-400 mt-4">&copy; 2026 RS Sistem MER &mdash; Pelaporan Insiden Obat</p>
    </div>

    <script src="data.js"></script>
    <script>
        // Akun dikelompokkan berdasarkan username — role dideteksi otomatis
        const accounts = {
            'nakes1':    { password: 'nakes123',    role: 'nakes',    redirect: 'nakes-dashboard.html' },
            'manager1':  { password: 'manager123',  role: 'manager',  redirect: 'dashboard-manager.html' },
            'komite1':   { password: 'komite123',   role: 'komite',   redirect: 'komite-dashboard.html' },
            'direktur1': { password: 'direktur123', role: 'direktur', redirect: 'direktur-dashboard.html' },
            'admin1':    { password: 'admin123',    role: 'admin',    redirect: 'admin-dashboard.html' }
        };

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L6.59 6.59m7.532 7.532l3.29 3.29M3 3l18 18"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const err = document.getElementById('errorMsg');

            const account = accounts[username];

            if (account && password === account.password) {
                localStorage.setItem('mer_user', JSON.stringify({ role: account.role, username }));
                window.location.href = account.redirect;
            } else {
                err.textContent = 'Nama pengguna atau kata sandi salah. Silakan coba lagi.';
                err.classList.remove('hidden');
            }
            return false;
        }
    </script>
</body>
</html>
