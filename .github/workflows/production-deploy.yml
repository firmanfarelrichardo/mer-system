name: Deploy ke Production

# ═══════════════════════════════════════════════════════════════
#  TRIGGER
# ═══════════════════════════════════════════════════════════════
# Pipeline berjalan ketika:
#   1. Ada push ke branch 'production' (deploy otomatis)
#   2. Dipicu manual dari tab Actions di GitHub (emergency re-deploy)
#
# CATATAN ARSITEKTUR — SELF-HOSTED RUNNER:
#   Workflow ini TIDAK menggunakan SSH dari GitHub ke VPS.
#   Sebaliknya, GitHub Actions Runner berjalan LANGSUNG di VPS dan
#   menghubungi GitHub secara outbound (polling).
#
#   Keunggulan model ini:
#   - Tidak ada port SSH yang perlu dibuka ke GitHub IP ranges
#     (mengeliminasi error "dial tcp: i/o timeout" selamanya).
#   - Runner memiliki akses langsung ke Docker, git, dan filesystem VPS.
#   - Tidak perlu secrets SSH key — runner sudah di VPS.
#   - Latency deployment lebih rendah (tidak ada overhead SSH tunnel).
#
#   Setup runner sekali saja di VPS:
#     bash /var/www/mer-system/deployment/production/setup-runner.sh
# ═══════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan deploy manual (untuk audit log)"
        required: true
        default: "Manual re-deploy oleh operator"

# ═══════════════════════════════════════════════════════════════
#  CONCURRENCY GUARD
#
#  Mencegah dua deployment berjalan bersamaan (race condition).
#
#  Skenario yang dicegah:
#    - Dua 'docker compose up --build' paralel di VPS yang sama
#    - Dua 'php artisan migrate' bersamaan → deadlock database
#    - Race condition pada APP_KEY di .env
#
#  cancel-in-progress: true → jika ada pipeline lama yang masih
#  berjalan saat push baru masuk, pipeline lama dibatalkan.
#  Pipeline baru SELALU menggunakan kode terbaru.
# ═══════════════════════════════════════════════════════════════
concurrency:
  group: production-deploy
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════
#  PERMISSIONS — Prinsip Least Privilege
#
#  Batasi permission token GitHub Actions hanya ke yang dibutuhkan.
#  Mencegah eskalasi privilege jika ada kompromi pada action
#  pihak ketiga yang dipakai dalam workflow ini.
# ═══════════════════════════════════════════════════════════════
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: VALIDASI
  #
  # Dijalankan di GitHub-hosted runner (bukan VPS) karena:
  #   1. Tidak membebani VPS untuk pekerjaan CI murni.
  #   2. Lebih cepat — GitHub-hosted runner selalu fresh.
  #   3. Memvalidasi struktur file sebelum menyentuh VPS sama sekali.
  #
  # Jika job ini gagal, job deploy TIDAK berjalan (needs: validate).
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validasi Pre-Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Tampilkan ringkasan deployment
        run: |
          echo "========================================"
          echo "  MER System — Production Deploy"
          echo "========================================"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Author   : ${{ github.actor }}"
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Trigger  : ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "  Alasan   : ${{ github.event.inputs.reason }}"
          fi
          echo "  Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================"

      - name: Validasi key wajib ada di .env.example
        run: |
          REQUIRED_KEYS=(
            APP_NAME
            APP_URL
            APP_KEY
            DB_DATABASE
            DB_USERNAME
            DB_PASSWORD
            REDIS_PASSWORD
            CROWDSEC_BOUNCER_API_KEY
          )
          MISSING=()
          for KEY in "${REQUIRED_KEYS[@]}"; do
            if ! grep -q "^${KEY}=" deployment/production/.env.example 2>/dev/null; then
              MISSING+=("$KEY")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: Key berikut tidak ditemukan di .env.example:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "Semua required key tersedia di .env.example."

      - name: Validasi file deploy kritis ada di repository
        run: |
          REQUIRED_FILES=(
            "deployment/production/deploy.sh"
            "deployment/production/docker-compose.yml"
            "deployment/production/.env.example"
          )
          MISSING=()
          for F in "${REQUIRED_FILES[@]}"; do
            [ ! -f "$F" ] && MISSING+=("$F")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: File berikut tidak ditemukan di repository:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "Semua file deploy kritis tersedia."

  # ─────────────────────────────────────────────────────────────
  # JOB 2: DEPLOY
  #
  # Berjalan LANGSUNG di VPS via self-hosted runner.
  #
  # Runner tidak memerlukan SSH karena ia sudah berada di VPS
  # dan dapat langsung mengeksekusi perintah Docker dan bash.
  #
  # Label runner: [self-hosted, production-vps]
  # Tambahkan kedua label saat mendaftarkan runner di:
  #   GitHub → Settings → Actions → Runners → Add runner
  #
  # PRASYARAT (setup SATU KALI di VPS):
  #   bash /var/www/mer-system/deployment/production/setup-runner.sh
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ke VPS Production
    runs-on: [self-hosted, production-vps]
    needs: validate
    environment: production

    steps:
      # ─────────────────────────────────────────────────────────
      # Step 1: Catat baseline commit untuk rollback.
      #
      # Commit ini menjadi target jika deploy gagal di langkah
      # selanjutnya. Disimpan ke $GITHUB_ENV agar tersedia di
      # semua step berikutnya (termasuk step kondisional).
      # ─────────────────────────────────────────────────────────
      - name: Catat baseline commit (target rollback)
        id: baseline
        run: |
          BASELINE=$(git -C /var/www/mer-system rev-parse HEAD 2>/dev/null || echo "")
          echo "ROLLBACK_COMMIT=${BASELINE}" >> "$GITHUB_ENV"
          echo "Baseline commit: ${BASELINE:-'(repository belum ada)'}"

      # ─────────────────────────────────────────────────────────
      # Step 2: Bootstrap git sync.
      #
      # Memaksa VPS mencerminkan remote SEBELUM deploy.sh dipanggil.
      # Ini mengeliminasi bootstrap paradox: deploy.sh versi lama
      # tidak dapat menghalangi versi baru masuk ke disk VPS.
      #
      # File yang tidak ditrack Git (.env, storage/) tidak tersentuh.
      # ─────────────────────────────────────────────────────────
      - name: Bootstrap — sinkronisasi kode ke commit terbaru
        run: |
          cd /var/www/mer-system
          git fetch origin production
          git checkout production
          git reset --hard origin/production
          echo "Sinkronisasi selesai: $(git rev-parse --short HEAD)"

      # ─────────────────────────────────────────────────────────
      # Step 3: Eksekusi deploy.sh (7 langkah berurutan).
      #
      # deploy.sh menggunakan 'set -e' dan trap ERR internal.
      # Jika step apapun gagal → script exit non-zero → job ini
      # exit dengan failure → step rollback aktif.
      # ─────────────────────────────────────────────────────────
      - name: Jalankan deploy.sh
        id: run_deploy
        run: |
          cd /var/www/mer-system/deployment/production
          bash deploy.sh

      # ─────────────────────────────────────────────────────────
      # Step 4: Rollback otomatis jika deploy gagal.
      #
      # Berjalan HANYA jika step run_deploy exit non-zero.
      # Mengembalikan kode ke ROLLBACK_COMMIT dan menjalankan
      # deploy.sh dengan kode versi lama.
      #
      # Rollback database (undone migrations) TIDAK dilakukan
      # secara otomatis — ini memerlukan keputusan manusia.
      # Untuk migrasi destructive, selalu buat backup terlebih dahulu
      # dan aktifkan lockdown.sh sebelum deploy dimulai.
      # ─────────────────────────────────────────────────────────
      - name: Rollback otomatis ke commit sebelumnya
        if: failure() && env.ROLLBACK_COMMIT != ''
        run: |
          echo ""
          echo "=========================================="
          echo "  DEPLOY GAGAL — Memulai rollback otomatis"
          echo "=========================================="
          echo "  Target rollback : ${ROLLBACK_COMMIT}"
          echo "  Timestamp       : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo ""

          cd /var/www/mer-system
          git reset --hard "${ROLLBACK_COMMIT}"
          echo "Kode di-reset ke: $(git rev-parse --short HEAD)"

          echo ""
          echo "Menjalankan deploy.sh dengan kode versi sebelumnya..."
          cd deployment/production
          bash deploy.sh

          echo ""
          echo "================================================"
          echo "  Rollback selesai. Uptime terjaga."
          echo "  TINDAKAN DIPERLUKAN: Investigasi penyebab"
          echo "  kegagalan via Grafana → Loki → Explore."
          echo "================================================"

      # ─────────────────────────────────────────────────────────
      # Step 5: Gate kesehatan pasca-deploy.
      #
      # Verifikasi independen setelah deploy.sh selesai.
      # Mendeteksi kondisi degradasi yang bisa muncul setelah
      # container start (OOM, restart loop, healthcheck failure).
      # ─────────────────────────────────────────────────────────
      - name: Gate kesehatan pasca-deploy
        if: success()
        run: |
          cd /var/www/mer-system/deployment/production

          echo "=== Status Container ==="
          docker compose ps
          echo ""

          # Beri waktu 5 detik agar restart loop bisa terdeteksi.
          sleep 5

          # Periksa container dalam status bermasalah.
          UNHEALTHY=$(docker compose ps --format "table {{.Name}}\t{{.State}}\t{{.Status}}" \
            | awk 'NR>1 && ($2 == "exited" || $2 == "dead" || $3 ~ /unhealthy/) {print $1}' || echo "")

          if [ -n "$UNHEALTHY" ]; then
            echo ""
            echo "ERROR: Container dalam kondisi tidak sehat:"
            echo "$UNHEALTHY"
            echo ""
            echo "Perintah investigasi:"
            for SVC in $UNHEALTHY; do
              echo "  docker compose logs ${SVC} --tail 50"
            done
            exit 1
          fi

          echo "Semua container dalam kondisi sehat."
          echo ""

          # Verifikasi Nginx merespons pada port lokal.
          echo "=== Verifikasi HTTP ==="
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 --max-time 10 \
            "http://localhost:${APP_PORT:-80}/" 2>/dev/null || echo "000")

          echo "HTTP status: ${HTTP_STATUS}"

          # 200, 301/302 (redirect HTTPS), 401/403 (auth guard) → valid.
          if [[ ! "$HTTP_STATUS" =~ ^(200|301|302|401|403)$ ]]; then
            echo "WARNING: Status HTTP tidak terduga: ${HTTP_STATUS}"
            echo "Investigasi: docker compose logs web --tail 30"
          fi

      # ─────────────────────────────────────────────────────────
      # Step 6: Audit log — selalu berjalan (sukses maupun gagal).
      # ─────────────────────────────────────────────────────────
      - name: Catat audit log deployment
        if: always()
        run: |
          LOG_DIR="/var/log/mer-deploy"
          mkdir -p "$LOG_DIR"

          JOB_STATUS="${{ job.status }}"
          {
            echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "status=${JOB_STATUS^^}"
            echo "commit=${{ github.sha }}"
            echo "actor=${{ github.actor }}"
            echo "trigger=${{ github.event_name }}"
            echo "rollback_baseline=${ROLLBACK_COMMIT:-n/a}"
            echo "---"
          } >> "${LOG_DIR}/deploy.log"

          echo "Audit log: ${LOG_DIR}/deploy.log"
