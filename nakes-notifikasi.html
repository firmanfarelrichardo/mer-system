<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi - Sistem MER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FEFFD3',
                        primary: '#2E7D32',
                        'primary-dark': '#1B5E20',
                        'primary-light': '#4CAF50',
                        sage: '#A5D6A7',
                        'sage-light': '#C8E6C9',
                        'status-red': '#E53935',
                        'status-orange': '#FB8C00',
                        'status-green': '#43A047'
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #FEFFD3; }
        .sidebar-link.active { background: rgba(165,214,167,.3); border-right: 3px solid #2E7D32; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Mobile Header -->
    <header class="lg:hidden fixed top-0 left-0 right-0 z-40 bg-primary text-white shadow-md">
        <div class="flex items-center justify-between px-4 py-3">
            <button id="menuToggle" class="p-1 rounded hover:bg-primary-dark transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="font-bold text-lg">Sistem MER</span>
            <div class="w-8 h-8 bg-sage rounded-full flex items-center justify-center text-primary-dark text-sm font-bold">NS</div>
        </div>
    </header>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-xl z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
        <!-- Logo -->
        <div class="p-5 border-b border-gray-100 bg-primary">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-white text-lg leading-tight">Sistem MER</h1>
                    <p class="text-xs text-white/80">Pelaporan Insiden Obat</p>
                </div>
            </div>
        </div>


        <!-- Navigation -->
        <nav class="flex-1 py-4 overflow-y-auto">
            <div class="px-4 mb-2">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Menu Utama</p>
            </div>

            <!-- Dashboard -->
            <a href="nakes-dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-gray-600 text-sm hover:bg-sage-light/30 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>
                </svg>
                Dashboard
            </a>

            <!-- Buat Laporan -->
            <a href="form-pelaporan.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-gray-600 text-sm hover:bg-sage-light/30 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Buat Laporan
            </a>

            <!-- Riwayat Laporan -->
            <a href="nakes-riwayat.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-gray-600 text-sm hover:bg-sage-light/30 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 5h6"/>
                </svg>
                Riwayat Laporan
            </a>

            <!-- Notifikasi (active) -->
            <a href="nakes-notifikasi.html" class="sidebar-link active flex items-center gap-3 px-4 py-2.5 text-primary font-semibold text-sm hover:bg-sage-light/30 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                Notifikasi
                <span id="sidebarBadge" class="ml-auto bg-status-red text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </a>

            <div class="px-4 mt-6 mb-2">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Pengaturan</p>
            </div>

            <!-- Profil Saya -->
            <a href="nakes-profil.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-gray-600 text-sm hover:bg-sage-light/30 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                Profil Saya
            </a>

            <!-- Pengaturan -->
            <a href="nakes-pengaturan.html" class="sidebar-link flex items-center gap-3 px-4 py-2.5 text-gray-600 text-sm hover:bg-sage-light/30 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.573-1.066z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Pengaturan
            </a>
        </nav>

        <!-- Keluar -->
        <div class="p-4 border-t border-gray-100">
            <a href="login.html" class="flex items-center gap-3 px-4 py-2.5 text-status-red text-sm font-medium hover:bg-red-50 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>
                </svg>
                Keluar
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-64 pt-16 lg:pt-0 min-h-screen">
        <!-- Page Header -->
        <div class="bg-gray-50 border-b border-gray-200 px-4 sm:px-6 lg:px-8 py-5 lg:h-[84px] flex items-center">
            <div class="flex items-center justify-between w-full">
                <div>
                    <h2 class="text-2xl font-bold text-gray-600">Notifikasi</h2>
                    <p class="text-gray-500 text-sm mt-1">Sistem Pelaporan Insiden Obat</p>
                </div>
                <!-- User Profile -->
                <div class="hidden lg:flex items-center gap-3">
                    <div>
                        <p class="font-semibold text-gray-800 text-sm text-right">Ns. Sari Dewi</p>
                        <p class="text-xs text-gray-500 text-right">Perawat - ICU</p>
                    </div>
                    <div class="w-10 h-10 bg-sage rounded-full flex items-center justify-center text-primary-dark font-bold text-sm">
                        NS
                    </div>
                </div>
            </div>
        </div>

        <div class="p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto">

            <!-- Action Bar -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <!-- Tandai Semua Dibaca -->
                    <button id="btnTandaiSemua" onclick="tandaiSemuaDibaca()" class="inline-flex items-center gap-2 text-sm font-medium text-primary hover:text-primary-dark transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Tandai Semua Dibaca
                    </button>

                    <!-- Filter Tabs -->
                    <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-1">
                        <button onclick="setFilter('semua')" data-filter="semua" class="filter-tab px-3 py-1.5 text-xs font-medium rounded-md transition bg-white text-primary shadow-sm">Semua</button>
                        <button onclick="setFilter('belum')" data-filter="belum" class="filter-tab px-3 py-1.5 text-xs font-medium rounded-md transition text-gray-500 hover:text-gray-700">Belum Dibaca</button>
                        <button onclick="setFilter('sudah')" data-filter="sudah" class="filter-tab px-3 py-1.5 text-xs font-medium rounded-md transition text-gray-500 hover:text-gray-700">Sudah Dibaca</button>
                    </div>
                </div>
            </div>

            <!-- Notification List -->
            <div id="notifList" class="space-y-3">
                <!-- Rendered by JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-12 text-center">
                    <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
                    </svg>
                    <p class="text-gray-500 font-medium">Tidak ada notifikasi</p>
                    <p class="text-gray-400 text-sm mt-1">Semua notifikasi akan muncul di sini</p>
                </div>
            </div>

        </div>
    </main>

    <script src="data.js"></script>
    <script>
        // Inisialisasi
        MER.init();

        let currentFilter = 'semua';

        // Sidebar mobile toggle
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        // Update badge count
        function updateBadge() {
            const notifikasi = MER.getNotifikasi();
            const unread = notifikasi.filter(n => !n.dibaca).length;
            const badge = document.getElementById('sidebarBadge');
            if (unread > 0) {
                badge.textContent = unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Get SVG icon based on notification type
        function getNotifIcon(tipe) {
            switch (tipe) {
                case 'umpan_balik':
                    // Green message circle
                    return `<div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                        </svg>
                    </div>`;
                case 'status':
                    // Green refresh circle
                    return `<div class="w-10 h-10 bg-sage-light rounded-full flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </div>`;
                case 'peringatan':
                    // Orange warning triangle
                    return `<div class="w-10 h-10 bg-orange-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>`;
                default:
                    // Green info circle (for 'sukses', 'selesai', 'info', etc.)
                    return `<div class="w-10 h-10 bg-sage-light rounded-full flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>`;
            }
        }

        // Render notification list
        function renderNotifikasi() {
            const notifikasi = MER.getNotifikasi();
            const container = document.getElementById('notifList');
            const emptyState = document.getElementById('emptyState');

            // Filter
            let filtered = notifikasi;
            if (currentFilter === 'belum') {
                filtered = notifikasi.filter(n => !n.dibaca);
            } else if (currentFilter === 'sudah') {
                filtered = notifikasi.filter(n => n.dibaca);
            }

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                container.innerHTML = filtered.map(notif => {
                    const isUnread = !notif.dibaca;
                    const cardBg = isUnread ? 'bg-red-50 border-l-4 border-l-status-red' : 'bg-white';
                    const titleWeight = isUnread ? 'font-semibold' : 'font-normal';

                    // Only show "Tandai Sudah Dibaca" button for unread items
                    const toggleButton = isUnread
                        ? `<button onclick="tandaiDibaca(${notif.id})" class="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium rounded-lg transition text-primary hover:bg-primary/10" title="Tandai Sudah Dibaca">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            <span class="hidden sm:inline">Tandai Dibaca</span>
                        </button>`
                        : '';

                    return `
                        <div class="${cardBg} rounded-xl shadow-sm border border-gray-100 p-4 transition hover:shadow-md">
                            <div class="flex items-start gap-3">
                                ${getNotifIcon(notif.tipe)}
                                <div class="flex-1 min-w-0">
                                    <p class="${titleWeight} text-gray-800 text-sm leading-snug">${notif.pesan}</p>
                                    <p class="text-xs text-gray-400 mt-1.5">${notif.tanggal}</p>
                                </div>
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    ${toggleButton}
                                    <button onclick="hapusNotifikasi(${notif.id})" class="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium text-status-red hover:bg-red-50 rounded-lg transition" title="Hapus">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                        </svg>
                                        <span class="hidden sm:inline">Hapus</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            updateBadge();
        }

        // Set filter
        function setFilter(filter) {
            currentFilter = filter;
            // Update active tab style
            document.querySelectorAll('.filter-tab').forEach(tab => {
                if (tab.dataset.filter === filter) {
                    tab.classList.add('bg-white', 'text-primary', 'shadow-sm');
                    tab.classList.remove('text-gray-500', 'hover:text-gray-700');
                } else {
                    tab.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                    tab.classList.add('text-gray-500', 'hover:text-gray-700');
                }
            });
            renderNotifikasi();
        }

        // Mark as read (one-way)
        function tandaiDibaca(id) {
            const notifikasi = MER.getNotifikasi();
            const notif = notifikasi.find(n => n.id === id);
            if (notif) {
                notif.dibaca = true;
                MER.saveNotifikasi(notifikasi);
                renderNotifikasi();
            }
        }

        // Mark all as read
        function tandaiSemuaDibaca() {
            const notifikasi = MER.getNotifikasi();
            notifikasi.forEach(n => n.dibaca = true);
            MER.saveNotifikasi(notifikasi);
            renderNotifikasi();
        }

        // Delete notification
        function hapusNotifikasi(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus notifikasi ini?')) return;
            let notifikasi = MER.getNotifikasi();
            notifikasi = notifikasi.filter(n => n.id !== id);
            MER.saveNotifikasi(notifikasi);
            renderNotifikasi();
        }

        // Initial render
        renderNotifikasi();
    </script>
</body>
</html>
